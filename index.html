<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipment requests</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17251f;
      --muted: #68766f;
      --line: #e5ebe7;
      --surface: #fff;
      --canvas: #f5f8f6;
      --green: #16734d;
      --green-dark: #105b3c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
    .topbar-inner, main { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
    .topbar-inner { height: 64px; display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
      background: #e5f3eb; color: var(--green); font-size: 18px; font-weight: 800;
    }
    .brand { font-weight: 700; letter-spacing: -.02em; }
    main { padding: 38px 0 56px; }
    .heading { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 25px; }
    h1 { margin: 0; font-size: clamp(27px, 4vw, 34px); line-height: 1.2; letter-spacing: -.04em; }
    .subtitle { margin: 7px 0 0; color: var(--muted); }
    .table-tools { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 20px; border-bottom: 1px solid var(--line); }
    .filter-control { display: flex; align-items: center; gap: 9px; }
    .filter-control label { margin: 0; white-space: nowrap; }
    .filter-control select { width: auto; min-width: 130px; height: 36px; }
    .count { color: var(--muted); font-size: 14px; white-space: nowrap; }
    .table-message { padding: 22px 20px; color: var(--muted); text-align: center; }
    .feedback { min-height: 20px; margin: 12px 0 0; color: var(--green-dark); font-size: 13px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 2px 8px #20382b08; }
    .table-panel { overflow: hidden; }
    .panel-title { padding: 17px 20px; border-bottom: 1px solid var(--line); font-weight: 650; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 680px; text-align: left; }
    th { background: #fafcfb; color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: .045em; text-transform: uppercase; }
    th, td { padding: 14px 20px; border-bottom: 1px solid var(--line); }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fbfdfb; }
    .id { color: var(--muted); font-variant-numeric: tabular-nums; }
    .priority { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 650; }
    .priority::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .high { color: #a54136; background: #fff0ee; }
    .medium { color: #96631a; background: #fff6e6; }
    .low { color: #397153; background: #edf7f0; }
    .form-panel { margin-top: 24px; padding: 20px; }
    .form-heading { margin-bottom: 17px; }
    h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .form-hint { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; align-items: end; gap: 13px; }
    label { display: block; margin-bottom: 6px; color: #45534c; font-size: 13px; font-weight: 600; }
    input, select {
      width: 100%; height: 41px; border: 1px solid #d9e1dc; border-radius: 8px; padding: 0 11px;
      background: #fff; color: var(--ink); font: inherit; font-size: 14px;
    }
    input:focus, select:focus { outline: 3px solid #16734d22; border-color: var(--green); }
    button {
      height: 41px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--green);
      color: #fff; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; white-space: nowrap;
    }
    button:hover { background: var(--green-dark); }
    @media (max-width: 820px) { form { grid-template-columns: repeat(2, minmax(0, 1fr)); } form button { grid-column: 1 / -1; } }
    @media (max-width: 560px) {
      .topbar-inner, main { width: min(100% - 28px, 1120px); }
      main { padding-top: 28px; }
      .heading { align-items: start; flex-direction: column; gap: 8px; }
      .table-tools { align-items: flex-start; flex-direction: column; gap: 10px; padding: 14px 16px; }
      .form-panel { padding: 16px; }
      form { grid-template-columns: 1fr; }
      form button { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-mark" aria-hidden="true">E</div>
      <div class="brand">EquipDesk</div>
    </div>
  </header>

  <main>
    <div class="heading">
      <div>
        <h1>Equipment requests</h1>
        <p class="subtitle">Track equipment your team needs.</p>
      </div>
    </div>

    <section class="panel table-panel" aria-labelledby="requests-title">
      <div class="panel-title" id="requests-title">All requests</div>
      <div class="table-tools">
        <div class="filter-control">
          <label for="priority-filter">Filter by priority</label>
          <select id="priority-filter">
            <option>All</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
          </select>
        </div>
        <div class="count" id="request-count" aria-live="polite">Showing 8 of 8 requests</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th scope="col">Request ID</th><th scope="col">Employee</th><th scope="col">Equipment item</th><th scope="col">Date requested</th><th scope="col">Priority</th></tr>
          </thead>
          <tbody id="request-list"></tbody>
        </table>
      </div>
    </section>
    <p class="feedback" id="request-feedback" aria-live="polite"></p>

    <section class="panel form-panel" aria-labelledby="form-title">
      <div class="form-heading">
        <h2 id="form-title">Add a request</h2>
        <p class="form-hint">Enter the employee and equipment details below.</p>
      </div>
      <form id="request-form">
        <div><label for="employee">Employee name</label><input id="employee" name="employee" placeholder="e.g. Alex Morgan"></div>
        <div><label for="item">Equipment item</label><input id="item" name="item" placeholder="e.g. Laptop"></div>
        <div><label for="date">Date requested</label><input id="date" name="date" type="date" required></div>
        <div><label for="priority">Priority</label><select id="priority" name="priority"><option>Medium</option><option>High</option><option>Low</option></select></div>
        <button type="submit">Add request</button>
      </form>
    </section>
  </main>

  <script>
    const requests = [
      { id: 1001, employee: "Maya Chen", item: "Laptop", date: "2026-11-12", priority: "High" },
      { id: 1002, employee: "Jordan Lee", item: "Wireless headset", date: "2026-11-12", priority: "Medium" },
      { id: 1003, employee: "Sam Rivera", item: "External monitor", date: "2026-11-11", priority: "Low" },
      { id: 1004, employee: "Avery Patel", item: "Ergonomic keyboard", date: "2026-11-10", priority: "Medium" },
      { id: 1005, employee: "Taylor Kim", item: "Laptop", date: "2026-11-09", priority: "High" },
      { id: 1006, employee: "Morgan Blake", item: "Webcam", date: "2026-11-08", priority: "Low" },
      { id: 1007, employee: "Casey Nguyen", item: "Docking station", date: "2026-11-07", priority: "Medium" },
      { id: 1008, employee: "Riley Brooks", item: "Office chair", date: "2026-11-06", priority: "Low" }
    ];

    const list = document.getElementById("request-list");
    const count = document.getElementById("request-count");
    const priorityFilter = document.getElementById("priority-filter");
    const feedback = document.getElementById("request-feedback");

    function displayDate(value) {
      const [year, month, day] = value.split("-").map(Number);
      return new Date(year, month - 1, day).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
    }

    function renderRequests() {
      list.replaceChildren();
      const selectedPriority = priorityFilter.value;
      const visibleRequests = selectedPriority === "All"
        ? requests
        : requests.filter((request) => request.priority === selectedPriority);

      visibleRequests.forEach((request) => {
        const row = document.createElement("tr");
        const cells = [
          { text: `REQ-${request.id}`, className: "id" },
          { text: request.employee },
          { text: request.item },
          { text: displayDate(request.date) }
        ];
        cells.forEach((cell) => {
          const td = document.createElement("td");
          td.textContent = cell.text;
          if (cell.className) td.className = cell.className;
          row.append(td);
        });
        const priorityCell = document.createElement("td");
        const badge = document.createElement("span");
        badge.className = `priority ${request.priority.toLowerCase()}`;
        badge.textContent = request.priority;
        priorityCell.append(badge);
        row.append(priorityCell);
        list.append(row);
      });
      count.textContent = `Showing ${visibleRequests.length} of ${requests.length} requests`;

      if (visibleRequests.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 5;
        cell.className = "table-message";
        cell.textContent = "No requests match this priority.";
        row.append(cell);
        list.append(row);
      }
    }

    priorityFilter.addEventListener("change", () => {
      feedback.textContent = "";
      renderRequests();
    });

    document.getElementById("request-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const data = new FormData(form);
      const employee = data.get("employee").trim();
      const item = data.get("item").trim();
      if (!employee || !item) {
        feedback.textContent = "Employee name and equipment item are required.";
        return;
      }
      requests.unshift({
        id: Math.max(...requests.map((request) => request.id)) + 1,
        employee,
        item,
        date: data.get("date"),
        priority: data.get("priority")
      });
      const addedPriority = data.get("priority");
      renderRequests();
      feedback.textContent = priorityFilter.value !== "All" && addedPriority !== priorityFilter.value
        ? "Request added. Switch to All to see it."
        : "";
      form.reset();
    });

    renderRequests();
  </script>
</body>
</html>
